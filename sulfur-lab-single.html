<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>硫 · Sulfur — Interactive Chemistry</title>
    <style>

      :root {
        --bg: #080d12;
        --panel: #101821;
        --panel-2: #0b1219;
        --ink: #e9eef5;
        --muted: #93a1b1;
        --line: #1d2834;
        --accent: #f4c542;
        --accent-soft: rgba(244, 197, 66, 0.14);
        --blue: #4ea1ff;
        --danger: #e06a5f;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --sans: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        letter-spacing: 0.01em;
        -webkit-font-smoothing: antialiased;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at 50% 18%, rgba(78, 161, 255, 0.07), transparent 48%),
          radial-gradient(circle at 82% 78%, rgba(244, 197, 66, 0.05), transparent 42%);
      }

      .app {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        max-width: 1180px;
        margin: 0 auto;
        padding: 24px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding-bottom: 18px;
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        min-width: 0;
      }

      .symbol {
        width: 56px;
        height: 56px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: var(--accent-soft);
        border: 1px solid rgba(244, 197, 66, 0.28);
        color: var(--accent);
        font-family: var(--mono);
        font-size: 30px;
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-size: clamp(20px, 2.3vw, 28px);
        letter-spacing: 0.02em;
      }

      .subtitle {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .badge {
        flex: 0 0 auto;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 7px;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.16em;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 360px;
        gap: 18px;
        padding-top: 18px;
      }

      .stage,
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        overflow: hidden;
      }

      .stage {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .stage-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 18px;
        border-bottom: 1px solid var(--line);
      }

      .kicker,
      .eyebrow {
        margin: 0;
        color: var(--accent);
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h2 {
        margin: 6px 0 0;
        font-size: 19px;
        font-weight: 600;
      }

      .stage-tools {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      button {
        font: inherit;
        cursor: pointer;
        min-height: 44px;
        border-radius: 8px;
        transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
      }

      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .ghost {
        padding: 10px 12px;
        color: var(--muted);
        background: transparent;
        border: 1px solid var(--line);
        font-size: 12px;
      }

      .ghost:hover {
        color: var(--ink);
        background: rgba(255, 255, 255, 0.04);
      }

      .primary {
        padding: 10px 14px;
        color: #1b1406;
        background: var(--accent);
        border: 1px solid rgba(244, 197, 66, 0.55);
        font-weight: 600;
        font-size: 13px;
      }

      .primary:hover {
        background: #f7d77b;
      }

      .viewport {
        flex: 1;
        min-height: 460px;
        background: #0a1017;
      }

      .viewport canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .webgl-error {
        padding: 24px;
        color: var(--danger);
        font-size: 14px;
        line-height: 1.5;
      }

      .stage-caption {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 18px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
      }

      .panel {
        display: flex;
        flex-direction: column;
      }

      .tabs {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        padding: 12px;
        border-bottom: 1px solid var(--line);
      }

      .tab {
        padding: 9px 11px;
        color: var(--muted);
        background: transparent;
        border: 1px solid transparent;
        font-size: 13px;
      }

      .tab:hover {
        color: var(--ink);
        background: rgba(255, 255, 255, 0.04);
      }

      .tab.active {
        color: var(--accent);
        background: var(--accent-soft);
        border-color: rgba(244, 197, 66, 0.25);
      }

      .panel-body {
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 16px 18px;
        overflow: auto;
      }

      .description {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.65;
      }

      .stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin: 0;
      }

      .stat {
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel-2);
      }

      .stat dt {
        margin: 0;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .stat dd {
        margin: 4px 0 0;
        color: var(--ink);
        font-family: var(--mono);
        font-size: 13px;
      }

      .equations {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .equation {
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel-2);
        color: var(--ink);
        font-family: var(--mono);
        font-size: 13px;
      }

      .oxidation {
        margin-top: 2px;
      }

      .oxidation-track {
        position: relative;
        height: 52px;
        margin-top: 8px;
        border-top: 1px solid var(--line);
      }

      .oxidation-track::before {
        content: "";
        position: absolute;
        top: 22px;
        left: 0;
        right: 0;
        height: 1px;
        background: var(--line);
      }

      .oxidation-mark {
        position: absolute;
        top: 0;
        transform: translateX(-50%);
        text-align: center;
        white-space: nowrap;
      }

      .oxidation-mark span {
        display: block;
        color: var(--ink);
        font-family: var(--mono);
        font-size: 11px;
      }

      .oxidation-mark small {
        display: block;
        margin-top: 4px;
        color: var(--accent);
        font-family: var(--mono);
        font-size: 12px;
      }

      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
      }

      .legend span {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .dot {
        width: 10px;
        height: 10px;
        display: inline-block;
        border-radius: 50%;
      }

      .dot.sulfur {
        background: var(--accent);
      }

      .dot.oxygen {
        background: var(--danger);
      }

      .dot.hydrogen {
        background: var(--ink);
      }

      .dot.electron {
        background: var(--blue);
      }

      .footer {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        margin-top: 18px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }

      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .viewport {
          min-height: 400px;
        }
      }

      @media (max-width: 620px) {
        .app {
          padding: 16px;
        }

        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }

        .badge {
          display: none;
        }

        .stage-head {
          flex-direction: column;
        }

        .stage-tools {
          justify-content: flex-start;
        }

        .footer {
          flex-direction: column;
        }

        .stats {
          grid-template-columns: 1fr;
        }

        .stage-caption {
          flex-direction: column;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        button {
          transition: none;
        }
      }
    
    </style>
